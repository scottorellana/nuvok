name: nuvok
description: Nuvok — Contigo cuando más importa. Biblioteca de conocimiento offline, mapas, IA local y comunicación mesh en una sola app + dispositivo.
publish_to: 'none'
version: 0.5.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Localización de widgets del sistema (diálogos, selectores) en los 7
  # idiomas de la app.
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.4
  xml: ^6.5.0
  markdown: ^7.2.0
  html: ^0.15.4
  flutter_widget_from_html_core: ^0.15.2
  flutter_inappwebview: ^6.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  vector_tile_renderer: ^5.1.0
  vector_tile: ^2.0.1
  # Lector PMTiles (ya transitiva vía vector_map_tiles_pmtiles): la usamos
  # para validar extracciones y convertir tileId↔ZXY en el extractor propio.
  pmtiles: ^1.3.0
  collection: ^1.18.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  wakelock_plus: ^1.2.8
  just_audio: ^0.9.39
  # Mesh: offline device-to-device transports.
  flutter_blue_plus: ^1.32.12
  nearby_connections: ^4.1.1
  # Bonjour/mDNS discovery: the iOS-sanctioned way to find peers on the LAN
  # (exempt from the multicast entitlement when declared in Info.plist).
  bonsoir: ^5.1.0
  battery_plus: ^7.1.0
  torch_light: ^2.0.0
  screen_brightness: ^2.1.11
  package_info_plus: ^10.2.0
  open_filex: ^4.7.0
  # Detecta la caída de internet para relanzar el descubrimiento del mesh
  # justo cuando los vecinos más necesitan encontrarse.
  connectivity_plus: ^6.1.0
  # Notificaciones locales: SOS/chat entrante avisan aunque la app no esté
  # en pantalla (radios BLE siguen activos en segundo plano).
  flutter_local_notifications: ^18.0.1
  record: ^7.1.1
  url_launcher: ^6.3.2
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.0
  path_provider_platform_interface: ^2.1.3
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  # Emblema oficial de Nuvok (ver assets/brand/nuvok/BRAND.md) recortado
  # edge-to-edge para que cada plataforma aplique su propio máscara de
  # esquinas. iOS/macOS/Windows usan la versión aplanada sobre negro sólido
  # (no admiten transparencia); Android usa un adaptive icon con la misma
  # imagen de fondo sólido negro + el emblema como foreground con margen de
  # zona segura (algunos launchers recortan agresivo el centro).
  image_path: "assets/branding/app_icon.png"
  android: true
  ios: true
  macos:
    generate: true
    image_path: "assets/branding/app_icon.png"
  windows:
    generate: true
    image_path: "assets/branding/app_icon.png"
  adaptive_icon_background: "#0b0b0a"
  adaptive_icon_foreground: "assets/branding/app_icon_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/map_theme_light_v4.json
    - assets/map_catalog.json
    - assets/brand/nuvok/
    - assets/branding/
    - assets/emergency_directory/
    - assets/emergency_guides/es/
    - assets/emergency_guides/en/
    - assets/emergency_guides/pt/
    - assets/emergency_guides/fr/
    - assets/emergency_guides/zh/
    - assets/emergency_guides/ja/
    - assets/emergency_guides/ht/
    - assets/emergency_guides/images/
    - assets/emergency_guides/tutorials/
    - assets/bundled_library/manifest.json
    # OJO: se declara el ARCHIVO, no el directorio zim/. Declarar la carpeta
    # arrastraría también la Wikipedia médica de 619 MB. Lo demás (modelos,
    # mapas, enciclopedia) NO se empaqueta: son paquetes que el usuario elige
    # y descarga desde Depósito. Ver manifest.json ("bundled") y el test
    # bundle_weight_test, que impide que algo pesado vuelva a colarse aquí.
    - assets/bundled_library/zim/wikipedia_mini.zim
