# Perfiles de país para instaladores de Nuvok
#
# Cada perfil define qué mapa (.pmtiles) e idioma se incluyen
# pre-cargados en el instalador de ese país. El script de build
# usa este archivo para seleccionar el bundle correcto.
#
# Para crear un instalador específico de país:
#   ./scripts/build_country.sh <country-id>
#
# El script:
#   1. Selecciona el mapa del país del catálogo
#   2. Genera el .pmtiles si no existe (requiere pmtiles CLI)
#   3. Copia el mapa a assets/bundled_library/maps/
#   4. Actualiza el manifest del bundle
#   5. Compila el APK con Flutter
#   6. Copia a dist/Nuvok-pad-v<version>-<country>.apk

profiles:
  # ── Perfil por defecto (Honduras + El Salvador) ──
  default:
    name: "Nuvok (Centroamérica)"
    language: es
    maps:
      - honduras
      - el-salvador
    extra_zim:
      - wikipedia_es_medicine_maxi_2026-04
      - wikipedia_mini

  # ── Honduras ──
