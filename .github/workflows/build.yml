# Builds Prepper Pad installers for every supported platform.
# macOS is the verified platform; the rest compile here and await
# verification on real hardware (see README "Estado por plataforma").
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build native engines
        run: |
          brew install cmake
          ./scripts/build_native_macos.sh
      - run: flutter pub get
      - run: flutter test
      - name: Package DMG
        run: ./scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: PrepperPad-macos
          path: dist/PrepperPad.dmg

  linux:
    strategy:
      fail-fast: false   # x64 must publish even if arm64 (experimental) fails
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm   # Raspberry Pi / ARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # arm64 Flutter tooling is less proven; don't let it fail the release.
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Flutter Linux + engines)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake clang git \
            curl unzip xz-utils libzstd1 liblzma5 zstd
      # subosito/flutter-action can't resolve an arm64 SDK, so install Flutter
      # from git directly — works on any architecture.
      - name: Install Flutter (git)
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-server -j4
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Assemble bundle
        run: |
          OUT=dist/prepper-pad-linux-${{ matrix.arch }}
          mkdir -p "$OUT"
          cp -r build/linux/*/release/bundle/* "$OUT/"
          mkdir -p "$OUT/bin"
          cp llama.cpp/build/bin/llama-server "$OUT/bin/"
          tar -C dist -czf dist/prepper-pad-linux-${{ matrix.arch }}.tar.gz \
            "prepper-pad-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: PrepperPad-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    # Pinned to 2022: windows-latest ships VS 2026 whose MSVC turns the
    # deprecated <experimental/coroutine> header (used by
    # flutter_inappwebview_windows) into a hard error, and a newer CMake that
    # trips CMP0175 in the native build. windows-2022's toolchain builds both.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DCMAKE_POLICY_DEFAULT_CMP0175=OLD
          cmake --build llama.cpp/build --target llama-server --config Release -j4
      - name: Fetch zstd + lzma DLLs
        run: |
          vcpkg install zstd:x64-windows liblzma:x64-windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Assemble bundle
        shell: bash
        run: |
          OUT=dist/prepper-pad-windows-x64
          mkdir -p "$OUT/bin"
          cp -r build/windows/x64/runner/Release/* "$OUT/"
          cp llama.cpp/build/bin/Release/llama-server.exe "$OUT/bin/" || \
            cp llama.cpp/build/bin/llama-server.exe "$OUT/bin/"
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/zstd.dll "$OUT/libzstd.dll"
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/liblzma.dll "$OUT/liblzma.dll"
          7z a dist/prepper-pad-windows-x64.zip "./$OUT/*"
      - uses: actions/upload-artifact@v4
        with:
          name: PrepperPad-windows
          path: dist/*.zip

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # The ZIM reader decompresses clusters with zstd via FFI; Android ships
      # no usable system libzstd, so we build it per ABI and bundle it in
      # jniLibs (DynamicLibrary.open('libzstd.so') finds it automatically).
      - name: Build libzstd for Android ABIs
        run: |
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S zstd/build/cmake -B zstd/out/$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-21 \
              -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_STATIC=OFF \
              -DZSTD_BUILD_SHARED=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build zstd/out/$ABI -j4
            mkdir -p android/app/src/main/jniLibs/$ABI
            cp zstd/out/$ABI/lib/libzstd.so android/app/src/main/jniLibs/$ABI/
          done
      - run: flutter pub get
      # Note: the AI module requires a llama-server binary per ABI; on Android
      # the chat module is disabled until the JNI build lands (see README).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: PrepperPad-android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    needs: [macos, linux, windows, android]
    # Publish whatever built, even if an experimental platform (Windows/arm64)
    # failed. Only the verified platforms are required to reach this job.
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            artifacts/**/PrepperPad.dmg
            artifacts/**/*.tar.gz
            artifacts/**/*.zip
            artifacts/**/*.apk
