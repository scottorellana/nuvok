# CI de Nuvok: los 550+ tests en cada push y PR.
#
# Deliberadamente NO compila las plataformas nativas (eso exige llama.cpp,
# SDKs y firmas): la suite Dart es pura y los tests de contrato nativo leen
# los fuentes Swift/Kotlin como texto, así que todo corre en un runner Linux.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze lib
      # Si algo falla, los nombres de los tests salen como anotaciones del
      # check (visibles sin descargar logs): la API pública solo muestra
      # anotaciones, y "7 failed" sin nombres no se puede diagnosticar.
      - name: Run flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test-output.log || {
            grep -E '\[E\]' test-output.log | sed 's/^/::error::/' | head -40
            exit 1
          }
