# nuvok-store — el Worker del muro de descarga (spec 2026-07-29).
#
# Estado del despliegue:
#   [x] D1 nuvok-purchases creada + esquema aplicado (2026-07-30, vía MCP)
#   [ ] R2: activar R2 en el panel de Cloudflare (un clic, acepta términos)
#       y luego crear el bucket 'nuvok-releases'
#   [ ] Subir binarios + releases.json al bucket (formato en src/index.js)
#   [ ] wrangler secret put LS_SIGNING_SECRET   (del webhook en Lemon Squeezy)
#       Opcional CRM: wrangler secret put GHL_TOKEN / GHL_LOCATION_ID
#   [ ] wrangler deploy   (primero sin routes → URL workers.dev de prueba;
#       las routes de abajo aplican cuando el DNS esté en Cloudflare)
#   [ ] En Lemon Squeezy: webhook → https://nuvok.org/webhook/lemonsqueezy
name = "nuvok-store"
main = "src/index.js"
compatibility_date = "2026-07-01"

# Rutas bajo el dominio (el sitio estático vive en Pages; el Worker atiende
# solo el API y el webhook).
routes = [
  { pattern = "nuvok.org/api/*", zone_name = "nuvok.org" },
  { pattern = "nuvok.org/webhook/*", zone_name = "nuvok.org" },
]

[[d1_databases]]
binding = "DB"
database_name = "nuvok-purchases"
database_id = "8638ff17-81f9-4ea2-8283-b5c18fd2af91"

[[r2_buckets]]
binding = "RELEASES"
bucket_name = "nuvok-releases"
