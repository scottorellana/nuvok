name: prepper_pad
description: Biblioteca de conocimiento offline — Wikipedia, mapas, IA local y notas en una sola app.
publish_to: 'none'
version: 0.3.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  # Localización de widgets del sistema (diálogos, selectores) en los 7
  # idiomas de la app.
  flutter_localizations:
    sdk: flutter
  ffi: ^2.1.0
  path_provider: ^2.1.4
  xml: ^6.5.0
  markdown: ^7.2.0
  html: ^0.15.4
  flutter_widget_from_html_core: ^0.15.2
  flutter_inappwebview: ^6.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  vector_map_tiles: ^8.0.0
  vector_map_tiles_pmtiles: ^1.5.0
  vector_tile_renderer: ^5.1.0
  vector_tile: ^2.0.1
  collection: ^1.18.0
  cryptography: ^2.7.0
  crypto: ^3.0.7
  qr_flutter: ^4.1.0
  file_selector: ^1.0.3
  wakelock_plus: ^1.2.8
  just_audio: ^0.9.39
  # Mesh: offline device-to-device transports.
  flutter_blue_plus: ^1.32.12
  nearby_connections: ^4.1.1
  # Bonjour/mDNS discovery: the iOS-sanctioned way to find peers on the LAN
  # (exempt from the multicast entitlement when declared in Info.plist).
  bonsoir: ^5.1.0
  battery_plus: ^7.1.0
  torch_light: ^2.0.0
  screen_brightness: ^2.1.11
  package_info_plus: ^10.2.0
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.31.0
  path_provider_platform_interface: ^2.1.3

flutter:
  uses-material-design: true
  assets:
    - assets/map_theme_light_v4.json
    - assets/map_catalog.json
    - assets/emergency_directory/
    - assets/emergency_guides/es/
    - assets/emergency_guides/en/
    - assets/emergency_guides/images/
    - assets/bundled_library/manifest.json
    - assets/bundled_library/maps/
    - assets/bundled_library/zim/
    - assets/bundled_library/models/
