# Compila Nuvok en TODAS las plataformas y sube los resultados como
# ARTIFACTS de CI (visibles para el mantenedor, con expiración) — la prueba
# pública de que el código compila en los 5 sistemas.
#
# Deliberadamente NO publica GitHub Releases: los binarios oficiales se
# venden en nuvok.org (muro de descarga, spec 2026-07-29). Un Release
# público regalaría exactamente lo que financia el proyecto. Quien quiera
# Nuvok gratis, compila desde el código (GPL) — README, 3 comandos.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build native engines (zstd + llama.cpp embebido via FFI)
        run: |
          brew install cmake
          git clone --depth 1 https://github.com/ggml-org/llama.cpp "$HOME/llama.cpp"
          export LLAMA_DIR="$HOME/llama.cpp"
          ./scripts/build_native_macos.sh
          ./scripts/build_llm_macos.sh
      - run: flutter pub get
      - run: flutter test
      - name: Package DMG
        run: ./scripts/package_macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvok-macos
          path: dist/Nuvok.dmg

  linux:
    strategy:
      fail-fast: false   # x64 debe terminar aunque arm64 (experimental) falle
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
          - runner: ubuntu-24.04-arm   # Raspberry Pi / ARM64
            arch: arm64
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.arch == 'arm64' }}
    steps:
      - uses: actions/checkout@v4
      - name: System deps (Flutter Linux + engines)
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev cmake clang git \
            curl unzip xz-utils libzstd1 liblzma5 zstd
      # subosito/flutter-action no resuelve SDK arm64; Flutter desde git
      # funciona en cualquier arquitectura.
      - name: Install Flutter (git)
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
      - name: Build llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF
          cmake --build llama.cpp/build --target llama-server -j4
      - run: flutter pub get
      - run: flutter test
      - run: flutter build linux --release
      - name: Assemble bundle
        run: |
          OUT=dist/nuvok-linux-${{ matrix.arch }}
          mkdir -p "$OUT"
          cp -r build/linux/*/release/bundle/* "$OUT/"
          mkdir -p "$OUT/bin"
          cp llama.cpp/build/bin/llama-server "$OUT/bin/"
          tar -C dist -czf dist/nuvok-linux-${{ matrix.arch }}.tar.gz \
            "nuvok-linux-${{ matrix.arch }}"
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvok-linux-${{ matrix.arch }}
          path: dist/*.tar.gz

  windows:
    # Fijado a 2022: windows-latest trae VS 2026 cuyo MSVC convierte el
    # header obsoleto <experimental/coroutine> (flutter_inappwebview_windows)
    # en error duro, y un CMake nuevo que dispara CMP0175 en el build nativo.
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build llama-server
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp
          cmake -S llama.cpp -B llama.cpp/build -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF -DCMAKE_POLICY_DEFAULT_CMP0175=OLD
          cmake --build llama.cpp/build --target llama-server --config Release -j4
      - name: Fetch zstd + lzma DLLs
        run: |
          vcpkg install zstd:x64-windows liblzma:x64-windows
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Assemble bundle
        shell: bash
        run: |
          OUT=dist/nuvok-windows-x64
          mkdir -p "$OUT/bin"
          cp -r build/windows/x64/runner/Release/* "$OUT/"
          cp llama.cpp/build/bin/Release/llama-server.exe "$OUT/bin/" || \
            cp llama.cpp/build/bin/llama-server.exe "$OUT/bin/"
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/zstd.dll "$OUT/libzstd.dll"
          cp "$VCPKG_INSTALLATION_ROOT"/installed/x64-windows/bin/liblzma.dll "$OUT/liblzma.dll"
          7z a dist/nuvok-windows-x64.zip "./$OUT/*"

      - name: Create installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          @"
          [Setup]
          AppName=Nuvok
          AppVersion=$version
          AppPublisher=Nuvok
          AppPublisherURL=https://nuvok.org
          DefaultDirName={pf}\Nuvok
          DefaultGroupName=Nuvok
          UninstallDisplayIcon={app}\prepper_pad.exe
          Compression=lzma2
          SolidCompression=yes
          OutputDir=dist
          OutputBaseFilename=Nuvok-Setup
          ArchitecturesAllowed=x64
          ArchitecturesInstallIn64BitMode=x64
          DisableProgramGroupPage=yes
          PrivilegesRequired=lowest

          [Files]
          Source: "dist\nuvok-windows-x64\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Nuvok"; Filename: "{app}\prepper_pad.exe"
          Name: "{userdesktop}\Nuvok"; Filename: "{app}\prepper_pad.exe"; Tasks: desktopicon

          [Tasks]
          Name: "desktopicon"; Description: "Create a desktop icon"; GroupDescription: "Additional icons:"
          "@ | Out-File -Encoding utf8 installer.iss
          iscc installer.iss

      - uses: actions/upload-artifact@v4
        with:
          name: Nuvok-windows
          path: |
            dist/*.zip
            dist/*.exe

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      # El lector ZIM descomprime con zstd por FFI; Android no trae libzstd
      # utilizable, así que se compila por ABI y va en jniLibs. libppllm (IA)
      # ya viene commiteado en jniLibs para arm64/x86_64.
      - name: Build libzstd for Android ABIs
        run: |
          git clone --depth 1 --branch v1.5.7 https://github.com/facebook/zstd
          for ABI in arm64-v8a armeabi-v7a x86_64; do
            cmake -S zstd/build/cmake -B zstd/out/$ABI \
              -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$ABI -DANDROID_PLATFORM=android-21 \
              -DZSTD_BUILD_PROGRAMS=OFF -DZSTD_BUILD_STATIC=OFF \
              -DZSTD_BUILD_SHARED=ON -DCMAKE_BUILD_TYPE=Release
            cmake --build zstd/out/$ABI -j4
            mkdir -p android/app/src/main/jniLibs/$ABI
            cp zstd/out/$ABI/lib/libzstd.so android/app/src/main/jniLibs/$ABI/
          done
      - run: flutter pub get
      # Sin secrets de firma en CI el APK sale con firma debug: sirve como
      # verificación de build, NO como binario de distribución (ese se firma
      # localmente con el keystore de release y se vende en nuvok.org).
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: Nuvok-android
          path: build/app/outputs/flutter-apk/app-release.apk

  # El job 'release' que publicaba los binarios en GitHub Releases se eliminó
  # a propósito (2026-08-01): regalaba en la pestaña Releases exactamente lo
  # que nuvok.org vende para financiar el proyecto. Los artifacts de arriba
  # cumplen la verificación multiplataforma sin regalar el producto.
